<section class="panel" style="margin-bottom:16px">
  <div class="row">
    <div class="field" style="min-width:170px"><label for="vend">Vendedor</label><select id="vend"></select></div>
    <div class="field" style="min-width:170px"><label for="linea">Línea</label><select id="linea"></select></div>
    <div class="field" style="min-width:170px"><label for="periodo">Periodo</label>
      <select id="periodo"><option value="12">Año completo</option><option value="6">Últimos 6 meses</option><option value="3">Últimos 3 meses</option></select>
    </div>
  </div>
</section>

<div class="cols" style="margin-bottom:16px">
  <div class="readout hi"><span class="k">Venta acumulada</span><span class="v" id="kVenta">—</span></div>
  <div class="readout"><span class="k">Margen bruto</span><span class="v" id="kMargen">—</span><span class="u" id="kMargenPct">—</span></div>
  <div class="readout"><span class="k">Mejor mes</span><span class="v" id="kMejor">—</span><span class="u" id="kMejorV">—</span></div>
  <div class="readout"><span class="k">Variación último mes</span><span class="v" id="kVar">—</span></div>
</div>

<div class="cols-2" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)">
  <div class="stack">
    <section class="panel"><h2>Venta y margen por mes</h2><div id="gSerie"></div></section>
    <section class="panel"><h2>Participación por línea</h2><div id="gLinea"></div></section>
  </div>
  <div class="stack">
    <section class="panel">
      <h2>Ranking de vendedores</h2>
      <div class="tablewrap"><table><thead><tr><th>Vendedor</th><th class="num">Venta</th><th class="num">Margen</th><th class="num">Part.</th></tr></thead><tbody id="rank"></tbody></table></div>
    </section>
    <section class="panel">
      <h2>Productos de mayor rotación</h2>
      <div class="tablewrap" style="max-height:330px;overflow-y:auto"><table><thead><tr><th>Producto</th><th class="num">kg/mes</th><th class="num">Margen u.</th></tr></thead><tbody id="top"></tbody></table></div>
    </section>
  </div>
</div>

<script>
const { $, el, fmt, soles, token, lineChart, barChart, draw, onThemeChange, guardarEstado, leerEstado } = CODE;
const { PRODUCTOS, MESES, VENDEDORES, ventasMensuales } = DATOS;

// El panel es de solo lectura sobre datos sintéticos; lo único que vale la pena
// recordar entre visitas son los filtros que el usuario dejó elegidos.
const FILTROS = ['#vend', '#linea', '#periodo'];
const filtrosGuardados = leerEstado('panel-ventas-filtros', null);

const DATA = ventasMensuales();
const LINEAS = Array.from(new Set(DATA.map(d => d.linea)));

function filtrar() {
  const v = $('#vend').value, l = $('#linea').value, p = +$('#periodo').value;
  const desde = 12 - p;
  return DATA.filter(d => (!v || d.vendedor === v) && (!l || d.linea === l) && d.m >= desde);
}

function render() {
  const filas = filtrar();
  const venta = filas.reduce((s, d) => s + d.monto, 0);
  const margen = filas.reduce((s, d) => s + d.margen, 0);

  const porMes = MESES.map((mes, m) => {
    const f = filas.filter(d => d.m === m);
    return { mes, m, monto: f.reduce((s, d) => s + d.monto, 0), margen: f.reduce((s, d) => s + d.margen, 0) };
  }).filter(x => filas.some(d => d.m === x.m));

  const mejor = porMes.reduce((a, b) => b.monto > a.monto ? b : a, porMes[0] || { mes: '—', monto: 0 });
  const ult = porMes[porMes.length - 1], pen = porMes[porMes.length - 2];
  const varPct = pen && pen.monto ? (ult.monto / pen.monto - 1) * 100 : 0;

  $('#kVenta').textContent = soles(venta, 0);
  $('#kMargen').textContent = soles(margen, 0);
  $('#kMargenPct').textContent = fmt(margen / (venta || 1) * 100, 1) + ' % sobre la venta';
  $('#kMejor').textContent = mejor.mes;
  $('#kMejorV').textContent = soles(mejor.monto, 0);
  $('#kVar').textContent = (varPct >= 0 ? '+' : '') + fmt(varPct, 1) + ' %';
  $('#kVar').style.color = varPct >= 0 ? 'var(--good)' : 'var(--bad)';

  draw($('#gSerie'), lineChart({
    series: [
      { points: porMes.map((d, i) => [i, d.monto]), color: token('accent'), width: 2.4, dots: 3, fill: 'color-mix(in srgb, ' + token('accent') + ' 14%, transparent)' },
      { points: porMes.map((d, i) => [i, d.margen]), color: token('blue'), width: 2, dash: '5 4', dots: 2.5 }
    ],
    w: 620, h: 280, yMin: 0,
    xTickVals: porMes.map((_, i) => i),
    xFmt: i => porMes[i] ? porMes[i].mes : '',
    yFmt: v => fmt(v / 1000, 0) + 'k',
    yLabel: 'Soles (miles)'
  }));

  const porLinea = LINEAS.map(l => ({
    label: l, value: filas.filter(d => d.linea === l).reduce((s, d) => s + d.monto, 0)
  }));
  draw($('#gLinea'), barChart({
    data: porLinea.map((d, i) => ({ ...d, color: [token('accent'), token('blue'), token('muted')][i % 3] })),
    w: 620, h: 230, showValues: true, yFmt: v => fmt(v / 1000, 0) + 'k'
  }));

  const rk = VENDEDORES.map(v => {
    const f = filas.filter(d => d.vendedor === v);
    return { v, monto: f.reduce((s, d) => s + d.monto, 0), margen: f.reduce((s, d) => s + d.margen, 0) };
  }).sort((a, b) => b.monto - a.monto);
  const tb = $('#rank'); tb.textContent = '';
  rk.forEach(r => tb.appendChild(el('tr', null, [
    el('td', { text: r.v }),
    el('td.num', { text: soles(r.monto, 0) }),
    el('td.num', { text: soles(r.margen, 0) }),
    el('td.num', { text: fmt(r.monto / (venta || 1) * 100, 1) + ' %' })
  ])));

  const top = PRODUCTOS.slice().sort((a, b) => b.rotacion - a.rotacion).slice(0, 12);
  const tt = $('#top'); tt.textContent = '';
  top.forEach(p => tt.appendChild(el('tr', null, [
    el('td', { text: p.nombre, style: 'white-space:normal;min-width:150px' }),
    el('td.num', { text: fmt(p.rotacion, 0) }),
    el('td.num', { text: fmt(p.lista - p.costo, 2) })
  ])));
}

$('#vend').appendChild(el('option', { value: '', text: 'Todos' }));
VENDEDORES.forEach(v => $('#vend').appendChild(el('option', { value: v, text: v })));
$('#linea').appendChild(el('option', { value: '', text: 'Todas' }));
LINEAS.forEach(l => $('#linea').appendChild(el('option', { value: l, text: l })));
if (filtrosGuardados) FILTROS.forEach(s => { if (filtrosGuardados[s] !== undefined) $(s).value = filtrosGuardados[s]; });
FILTROS.forEach(s => $(s).addEventListener('input', () => {
  guardarEstado('panel-ventas-filtros', Object.fromEntries(FILTROS.map(k => [k, $(k).value])));
  render();
}));
onThemeChange(render);
render();

/* ---- exportación de resultados ---- */
const X = CODE.exportar;
X.registrar(() => ({
  titulo: 'Panel de ventas',
  subtitulo: ($('#vend').value || 'Todos los vendedores') + ' · ' + ($('#linea').value || 'Todas las líneas') +
    ' · ' + $('#periodo').selectedOptions[0].textContent,
  resumen: X.desdeReadouts(),
  tablas: [
    { titulo: 'Venta y margen por mes', columnas: ['Mes', 'Venta', 'Margen'],
      filas: MESES.map((mes, m) => {
        const f = filtrar().filter(d => d.m === m);
        return f.length ? [mes, f.reduce((s, d) => s + d.monto, 0), f.reduce((s, d) => s + d.margen, 0)] : null;
      }).filter(Boolean) },
    X.desdeTbody('#rank', ['Vendedor', 'Venta', 'Margen', 'Participación'], 'Ranking de vendedores')
  ].filter(t => t.filas.length),
  nota: 'Series de venta sintéticas generadas con semilla fija.'
}));

</script>

<section class="panel" style="margin-bottom:16px">
  <div class="row" style="gap:14px">
    <div class="field" style="min-width:130px"><label for="cantidad">Registros</label><input type="number" id="cantidad" value="25" min="1" max="500" step="1"></div>
    <div class="field" style="min-width:130px"><label for="semilla">Semilla</label><input type="number" id="semilla" value="2026" step="1"></div>
    <div class="field" style="min-width:170px"><label for="entidad">Entidad</label>
      <select id="entidad"><option value="clientes">Clientes</option><option value="pedidos">Pedidos</option><option value="empleados">Empleados</option></select>
    </div>
    <button class="primary" id="generar" style="align-self:flex-end">Generar</button>
    <button class="sm" id="otra" style="align-self:flex-end">Otra semilla</button>
  </div>
  <div class="row" id="campos" style="margin-top:14px;gap:10px"></div>
</section>

<div class="cols-2" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)">
  <section class="panel">
    <h2>Vista previa</h2>
    <div class="tablewrap" style="max-height:520px;overflow:auto"><table id="tabla"><thead></thead><tbody></tbody></table></div>
  </section>

  <section class="panel">
    <h2>Exportar</h2>
    <div class="seg" id="formato">
      <button aria-pressed="true" data-f="json">JSON</button>
      <button aria-pressed="false" data-f="csv">CSV</button>
      <button aria-pressed="false" data-f="sql">SQL</button>
      <button aria-pressed="false" data-f="ts">TypeScript</button>
    </div>
    <div class="console" id="salida" style="margin-top:12px;max-height:470px"></div>
    <div class="row" style="margin-top:12px">
      <button class="sm" id="copiar">Copiar al portapapeles</button>
      <span class="chip" id="peso">—</span>
    </div>
  </section>
</div>

<script>
const { $, $$, el, fmt } = CODE;

const NOMBRES = ['Ana','Luis','María','Carlos','Rosa','Jorge','Elena','Miguel','Lucía','Pedro','Sofía','Diego','Carmen','Andrés','Paola','Renzo','Milagros','Gonzalo','Fiorella','César','Yessica','Alonso','Katherine','Bruno'];
const APELLIDOS = ['Quispe','Ramírez','Huamán','Flores','Vargas','Chávez','Mendoza','Paredes','Castillo','Rojas','Salazar','Ccahuana','Lozano','Zapata','Espinoza','Tapia','Bravo','Ocampo','Villanueva','Ayala'];
const RUBROS = ['Pollería','Sanguchería','Pizzería','Chifa','Cafetería','Minimarket','Restaurante','Panadería','Catering','Fast food'];
const NEGOCIOS = ['El Dorado','La Esquina','Don Pepe','Buen Sabor','La Estación','Doña Rosa','Tres Marías','El Rincón','Sabor Norteño','La Casona','Punto Azul','Mi Tierra','El Fogón','La Cosecha'];
const DISTRITOS = ['Miraflores','San Isidro','Surco','Breña','Los Olivos','Comas','San Juan de Lurigancho','Ate','Chorrillos','Independencia','Jesús María','Surquillo','San Martín de Porres','Villa El Salvador','Magdalena'];
const ESTADOS = ['activo','activo','activo','en riesgo','inactivo'];
const CARGOS = ['Vendedor','Repartidor','Almacenero','Asistente comercial','Supervisor de ruta','Analista'];
const PRODUCTOS = ['Hot dog de pollo','Chorizo parrillero','Queso mozzarella','Jamonada de pollo','Nuggets de pollo','Crema de leche','Queso Edam','Tocino ahumado'];

const CAMPOS = {
  clientes: ['id', 'razon_social', 'contacto', 'correo', 'telefono', 'rubro', 'distrito', 'estado', 'ticket_promedio', 'alta'],
  pedidos: ['id', 'codigo', 'cliente', 'producto', 'cantidad', 'precio_unitario', 'importe', 'estado', 'fecha'],
  empleados: ['id', 'nombres', 'apellidos', 'correo', 'cargo', 'distrito', 'sueldo', 'ingreso']
};
let activos = new Set(CAMPOS.clientes);
let registros = [], formato = 'json';

/* Congruencial lineal: reproducible a partir de la semilla. */
function motor(semilla) {
  let s = (semilla >>> 0) || 1;
  const r = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  return {
    r,
    entero: (a, b) => a + Math.floor(r() * (b - a + 1)),
    elegir: arr => arr[Math.floor(r() * arr.length)],
    decimal: (a, b, d) => +(a + r() * (b - a)).toFixed(d === undefined ? 2 : d),
    fecha: (desdeDias, hastaDias) => {
      const f = new Date(2026, 8, 17);
      f.setDate(f.getDate() - (desdeDias + Math.floor(r() * (hastaDias - desdeDias))));
      return f.toISOString().slice(0, 10);
    }
  };
}

const sinTildes = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z]/g, '');

function generar() {
  const m = motor(+$('#semilla').value);
  const n = Math.min(500, Math.max(1, Math.round(+$('#cantidad').value || 25)));
  const entidad = $('#entidad').value;
  registros = [];

  for (let i = 1; i <= n; i++) {
    const nombre = m.elegir(NOMBRES);
    const apellido = m.elegir(APELLIDOS);
    const rubro = m.elegir(RUBROS);
    const negocio = rubro + ' ' + m.elegir(NEGOCIOS);
    const distrito = m.elegir(DISTRITOS);
    let fila;

    if (entidad === 'clientes') {
      fila = {
        id: i,
        razon_social: negocio,
        contacto: nombre + ' ' + apellido,
        correo: sinTildes(nombre) + '.' + sinTildes(apellido) + '@' + sinTildes(negocio).slice(0, 14) + '.pe',
        telefono: '9' + String(m.entero(10000000, 99999999)),
        rubro, distrito,
        estado: m.elegir(ESTADOS),
        ticket_promedio: m.decimal(180, 4200),
        alta: m.fecha(20, 900)
      };
    } else if (entidad === 'pedidos') {
      const cantidad = m.entero(1, 40);
      const precio = m.decimal(8, 42);
      fila = {
        id: i,
        codigo: 'PED-' + String(20000 + i * m.entero(1, 3)),
        cliente: negocio,
        producto: m.elegir(PRODUCTOS),
        cantidad, precio_unitario: precio,
        importe: +(cantidad * precio).toFixed(2),
        estado: m.elegir(['entregado', 'entregado', 'en ruta', 'anulado']),
        fecha: m.fecha(0, 180)
      };
    } else {
      fila = {
        id: i,
        nombres: nombre,
        apellidos: apellido + ' ' + m.elegir(APELLIDOS),
        correo: sinTildes(nombre)[0] + sinTildes(apellido) + '@code.pe',
        cargo: m.elegir(CARGOS),
        distrito,
        sueldo: m.decimal(1300, 4800, 0),
        ingreso: m.fecha(60, 1800)
      };
    }
    registros.push(fila);
  }
  pintar();
}

function columnas() { return CAMPOS[$('#entidad').value].filter(c => activos.has(c)); }

function pintarCampos() {
  const cont = $('#campos'); cont.textContent = '';
  CAMPOS[$('#entidad').value].forEach(c => {
    const id = 'c_' + c;
    const chk = el('input', { type: 'checkbox', id });
    chk.checked = activos.has(c);
    chk.addEventListener('change', () => { chk.checked ? activos.add(c) : activos.delete(c); pintar(); });
    cont.appendChild(el('label', { for: id, style: 'display:inline-flex;align-items:center;gap:6px;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer' }, [chk, c]));
  });
}

function pintar() {
  const cols = columnas();
  const t = $('#tabla');
  t.querySelector('thead').textContent = '';
  t.querySelector('tbody').textContent = '';
  t.querySelector('thead').appendChild(el('tr', null, cols.map(c => el('th', { text: c }))));
  const tb = t.querySelector('tbody');
  registros.slice(0, 120).forEach(r => tb.appendChild(el('tr', null, cols.map(c =>
    el(typeof r[c] === 'number' ? 'td.num' : 'td', { text: String(r[c] ?? '') })))));
  pintarSalida();
}

function serializar() {
  const cols = columnas();
  const filtrados = registros.map(r => Object.fromEntries(cols.map(c => [c, r[c]])));
  const tabla = $('#entidad').value;

  if (formato === 'json') return JSON.stringify(filtrados, null, 2);
  if (formato === 'csv') {
    const escapa = v => /[",;\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
    return [cols.join(','), ...filtrados.map(r => cols.map(c => escapa(r[c])).join(','))].join('\n');
  }
  if (formato === 'sql') {
    const val = v => typeof v === 'number' ? String(v) : "'" + String(v).replace(/'/g, "''") + "'";
    return filtrados.map(r => `INSERT INTO ${tabla} (${cols.join(', ')}) VALUES (${cols.map(c => val(r[c])).join(', ')});`).join('\n');
  }
  const tipo = v => typeof v === 'number' ? 'number' : 'string';
  const nombreTipo = tabla.charAt(0).toUpperCase() + tabla.slice(1, -1);
  return `export interface ${nombreTipo} {\n` +
    cols.map(c => `  ${c}: ${tipo(registros[0] ? registros[0][c] : '')};`).join('\n') +
    `\n}\n\nexport const ${tabla}: ${nombreTipo}[] = ` + JSON.stringify(filtrados.slice(0, 5), null, 2) +
    (filtrados.length > 5 ? `;\n// … ${filtrados.length - 5} registros más` : ';');
}

function pintarSalida() {
  const texto = serializar();
  $('#salida').textContent = texto;
  $('#peso').textContent = registros.length + ' registros · ' + fmt(new Blob([texto]).size / 1024, 1) + ' KB';
}

$$('#formato button').forEach(b => b.addEventListener('click', () => {
  $$('#formato button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  formato = b.dataset.f;
  pintarSalida();
}));
$('#generar').addEventListener('click', generar);
$('#otra').addEventListener('click', () => { $('#semilla').value = Math.floor(Math.random() * 99999); generar(); });
$('#entidad').addEventListener('input', () => { activos = new Set(CAMPOS[$('#entidad').value]); pintarCampos(); generar(); });
['#cantidad', '#semilla'].forEach(s => $(s).addEventListener('input', generar));
$('#copiar').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(serializar()); $('#copiar').textContent = 'Copiado'; }
  catch (e) { $('#copiar').textContent = 'Selecciona y copia manualmente'; }
  setTimeout(() => { $('#copiar').textContent = 'Copiar al portapapeles'; }, 2000);
});

pintarCampos();
generar();

/* ---- exportación de resultados ---- */
const X = CODE.exportar;
X.registrar(() => ({
  titulo: 'Datos de prueba · ' + $('#entidad').selectedOptions[0].textContent,
  subtitulo: registros.length + ' registros con semilla ' + $('#semilla').value,
  resumen: [
    { k: 'Entidad', v: $('#entidad').selectedOptions[0].textContent },
    { k: 'Registros', v: registros.length },
    { k: 'Semilla', v: $('#semilla').value },
    { k: 'Campos', v: columnas().join(', ') }
  ],
  tablas: [{ titulo: 'Registros', columnas: columnas(), filas: registros.map(r => columnas().map(c => r[c])) }],
  nota: 'Datos sintéticos: nombres, negocios y correos son inventados y no corresponden a personas reales.'
}));

</script>
